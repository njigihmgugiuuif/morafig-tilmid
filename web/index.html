<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E5F74">
  <meta name="color-scheme" content="light dark">

  <title>مرافق التلميذ — ثانوية رابح بطاط</title>
  <meta name="description" content="مرافق التلميذ: تطبيق المرافقة والتنظيم الدراسي طوال العام لتلاميذ ثانوية رابح بطاط — تخطيط دراسي، متابعة التقدم، المراجعة، الأولويات، والامتحانات، ويعمل بدون اتصال بالإنترنت.">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="مرافق التلميذ">
  <meta property="og:description" content="المرافقة والتنظيم الدراسي طوال العام — ثانوية رابح بطاط">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مرافق التلميذ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // «تثبيت التطبيق»: keep the browser's install prompt for the Flutter side.
    window.__mqDeferredInstall = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__mqDeferredInstall = e;
    });
    window.addEventListener('appinstalled', function () {
      window.__mqDeferredInstall = null;
    });
    window.mqCanInstall = function () { return !!window.__mqDeferredInstall; };
    window.mqIsStandalone = function () {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
    };
    window.mqInstall = function () {
      var e = window.__mqDeferredInstall;
      if (!e) return Promise.resolve(false);
      window.__mqDeferredInstall = null;
      e.prompt();
      return e.userChoice.then(function (c) { return c.outcome === 'accepted'; });
    };
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (const registration of registrations) {
          registration.unregister();
        }
      });
    }
    if (window.caches) {
      caches.keys().then(function (names) {
        for (const name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <div id="app-loading" style="
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:#1E5F74; color:#fff; font-family:sans-serif; gap:12px;">
    <div style="font-size:20px; font-weight:bold;">مرافق التلميذ</div>
    <div style="width:32px;height:32px;border:3px solid rgba(255,255,255,.3);
      border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
