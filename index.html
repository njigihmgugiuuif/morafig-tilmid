  <script>
    // «تثبيت التطبيق»: keep the browser's install prompt for the Flutter side.
    window.__mqDeferredInstall = null;
    window.__mqInstallListeners = [];
    function mqNotify() {
      window.__mqInstallListeners.forEach(function (f) { try { f(); } catch (_) {} });
    }
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__mqDeferredInstall = e;
      mqNotify();
    });
    window.addEventListener('appinstalled', function () {
      window.__mqDeferredInstall = null;
      mqNotify();
    });
    window.mqWatchInstall = function (cb) { window.__mqInstallListeners.push(cb); };
    window.mqIsIos = function () {
      var ua = window.navigator.userAgent || '';
      return /iPad|iPhone|iPod/.test(ua) ||
        (window.navigator.platform === 'MacIntel' && window.navigator.maxTouchPoints > 1);
    };
    window.mqCanInstall = function () { return !!window.__mqDeferredInstall; };
    window.mqIsStandalone = function () {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
    };
    window.mqInstall = function () {
      var e = window.__mqDeferredInstall;
      if (!e) return Promise.resolve(false);
      window.__mqDeferredInstall = null;
      e.prompt();
      return e.userChoice.then(function (c) { return c.outcome === 'accepted'; });
    };
  </script>
  <script>
    // Offline use. Current Flutter ships NO caching service worker, so the app
    // has its own (web/mq_sw.js, published as flutter_service_worker.js by the
    // deploy workflow). It is registered only when the file really is ours:
    // Flutter's own file is a clean-up stub that would unregister itself.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        fetch('flutter_service_worker.js', { cache: 'no-cache' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (t) {
            if (t.indexOf('mq-offline-sw') < 0) return;
            return navigator.serviceWorker.getRegistration().then(function (reg) {
              var w = reg && (reg.active || reg.waiting || reg.installing);
              if (w && w.scriptURL.indexOf('flutter_service_worker.js') >= 0) {
                return reg.update();
              }
              return navigator.serviceWorker.register('flutter_service_worker.js?v=3426277871') /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
            });
          })
          .catch(function () {});
      });
      // Ask the browser not to clear the app's data under storage pressure
      // (Chrome answers silently; Firefox would show a question, so skip it).
      try {
        if (navigator.storage && navigator.storage.persist &&
            !/Firefox\//.test(navigator.userAgent || '')) {
          navigator.storage.persist().catch(function () {});
        }
      } catch (_) {}
    })();
  </script>
