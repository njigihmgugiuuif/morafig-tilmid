name: Apply round 6 files

# One-time helper (same pattern as "Apply phase C files"). Upload
# round6_files.zip to the repository ROOT (one upload), then run this workflow
# manually (Actions -> Apply round 6 files -> Run workflow). It unpacks
# the zip keeping every file's own folder path (per-photo delivery with server confirmation and read-back, retries, plain wording, real-server test),
# deletes the zip and commits to main. It refuses any path outside lib/, test/ and web/, so
# it never touches .github/ and it does
# not deploy. Afterwards run "Flutter analyze and test" manually (a commit made
# with the built-in token does not start other workflows).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        shell: bash
        run: |
          set -e
          [ -f round6_files.zip ] || { echo "round6_files.zip is not in the repository root. Upload it first."; exit 1; }
          unzip -l round6_files.zip
          if unzip -Z1 round6_files.zip | grep -v '/$' | grep -vE '^(lib/|test/|web/|supabase/|SUPABASE_SETUP_AR.md$)'; then
            echo "The zip contains a path outside lib/, test/, web/, supabase/ ."; exit 1
          fi
          if unzip -Z1 round6_files.zip | grep -E '(^/|\.\./)'; then
            echo "The zip contains an unsafe path."; exit 1
          fi
          unzip -o round6_files.zip
          rm round6_files.zip
          for f in lib/ui/screens/about_screen.dart lib/ui/screens/constitution_screen.dart lib/platform/page_control.dart test/about_screens_test.dart; do
            [ -f "$f" ] || { echo "MISSING after unpack: $f"; exit 1; }
          done

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply round 6: teacher lessons card, constitution, about, section fix, freeze fix"
          git push
