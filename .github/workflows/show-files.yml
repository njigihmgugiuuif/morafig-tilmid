name: Show files

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print needed files
        run: |
          set +e
          {
            echo "## 1. _uuidGen"
            echo '```'
            grep -rn "_uuidGen" lib --include=*.dart | grep -v "\.g\.dart" | head -20
            echo '```'
            echo "## 2. tables Streams / Availabilities"
            echo '```'
            grep -rn -A8 -E "^class (Streams|Availabilities) " lib/database/tables
            echo '```'
            echo "## 3. append_only_repository.dart"
            echo '```'
            head -60 lib/repositories/append_only_repository.dart
            echo '```'
            echo "## 4. repositories imports"
            echo '```'
            for f in event_repository error_repository recovery_repository explanation_and_override_repositories; do
              echo "--- $f"; head -14 lib/repositories/$f.dart
            done
            echo '```'
            echo "## 5. reality_layer_domain.dart"
            echo '```'
            sed -n 1,22p lib/domain/reality_layer_domain.dart
            echo "..."
            sed -n 60,90p lib/domain/reality_layer_domain.dart
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
