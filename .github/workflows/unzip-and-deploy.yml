name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Generate drift code
        run: dart run build_runner build

      - name: Download sqlite3.wasm and drift_worker.js
        run: |
          curl -L -o web/sqlite3.wasm https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.6.0/sqlite3.wasm
          curl -L -o web/drift_worker.js https://github.com/simolus3/drift/releases/download/drift-2.35.0/drift_worker.js
          ls -la web/sqlite3.wasm web/drift_worker.js

      - name: Build Web
        run: flutter build web --release --base-href "/morafig-tilmid/"

      - name: Build diagnostic page (separate entrypoint, does not affect main app)
        run: |
          flutter build web --release -t lib/main_diagnose.dart \
            --base-href "/morafig-tilmid/diagnose/" \
            --output build/web_diagnose
          mkdir -p build/web/diagnose
          cp -r build/web_diagnose/* build/web/diagnose/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
