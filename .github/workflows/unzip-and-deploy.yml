name: Unzip and deploy project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive to repo root
        run: |
          unzip -o student_app_foundation_merged_complete.zip -d _extracted_tmp || true
          shopt -s dotglob
          SRC_DIR=$(find _extracted_tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: extraction failed, no folder found"
            ls -la
            exit 1
          fi
          mv "$SRC_DIR"/* .
          rm -rf _extracted_tmp
          rm -f student_app_foundation_merged_complete.zip

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract project archive into repo root" || echo "Nothing to commit"
          git push
          
