name: Apply final batch files

# One-time helper: school timetable, exam-load chart, delete buttons in «واقعي», offline-ready card,
# and new tests. Upload final_batch_files.zip to the repository ROOT, then run
# manually. It refuses any path outside lib/ and test/, deletes the zip, commits,
# does not deploy. After it, run «Flutter analyze and test» by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        shell: bash
        run: |
          set -e
          [ -f final_batch_files.zip ] || { echo "final_batch_files.zip is not in the repository root. Upload it first."; exit 1; }
          unzip -l final_batch_files.zip
          if unzip -Z1 final_batch_files.zip | grep -v '/$' | grep -vE '^(lib|test|web)/'; then
            echo "The zip contains a path outside lib/, test/ or web/."; exit 1
          fi
          if unzip -Z1 final_batch_files.zip | grep -E '(^/|\.\./)'; then
            echo "The zip contains an unsafe path."; exit 1
          fi
          unzip -o final_batch_files.zip
          rm final_batch_files.zip
          for f in lib/domain/school_timetable_domain.dart lib/services/school_timetable_service.dart lib/ui/screens/school_timetable_screen.dart lib/ui/state/exam_load.dart lib/ui/screens/exam_load_card.dart test/school_timetable_domain_test.dart test/school_timetable_service_test.dart test/exam_load_test.dart test/pwa_files_test.dart lib/ui/widgets/offline_ready_card.dart web/index.html; do
            [ -f "$f" ] || { echo "MISSING after unpack: $f"; exit 1; }
          done

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply final batch: school timetable, exam-load chart, delete buttons, tests"
          git push
