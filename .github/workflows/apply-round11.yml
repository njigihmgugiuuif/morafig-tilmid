name: Apply round 11 files

# One-time helper (same pattern as "Apply phase C files"). Upload
# round11_files.zip to the repository ROOT (one upload), then run this workflow
# manually (Actions -> Apply round 11 files -> Run workflow). It unpacks
# the zip keeping every file's own folder path (per-photo delivery with server confirmation and read-back, retries, plain wording, real-server test),
# deletes the zip and commits to main. It refuses any path outside lib/, test/ and web/, so
# it never touches .github/ and it does
# not deploy. Afterwards run "Flutter analyze and test" manually (a commit made
# with the built-in token does not start other workflows).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        shell: bash
        run: |
          set -e
          [ -f round11_files.zip ] || { echo "round11_files.zip is not in the repository root. Upload it first."; exit 1; }
          unzip -l round11_files.zip
          if unzip -Z1 round11_files.zip | grep -v '/$' | grep -vE '^(lib/|test/|web/|supabase/|tools/|SUPABASE_SETUP_AR.md$)'; then
            echo "The zip contains a path outside lib/, test/, web/, supabase/, tools/ ."; exit 1
          fi
          if unzip -Z1 round11_files.zip | grep -E '(^/|\.\./)'; then
            echo "The zip contains an unsafe path."; exit 1
          fi
          unzip -o round11_files.zip
          rm round11_files.zip
          for f in lib/ui/design/icon3d.dart web/mq_sw.js tools/make_offline_worker.py supabase/functions/teacher-publish/index.ts; do
            [ -f "$f" ] || { echo "MISSING after unpack: $f"; exit 1; }
          done

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply round 11: offline worker, teacher numbers, UI refresh"
          git push
