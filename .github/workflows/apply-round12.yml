name: Apply round 12 files

# One-time helper: SEO files only (web/). Upload round12_files.zip to the repository ROOT,
# then run manually. It refuses any path outside web/, deletes the zip, commits, does not deploy.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        shell: bash
        run: |
          set -e
          [ -f round12_files.zip ] || { echo "round12_files.zip is not in the repository root. Upload it first."; exit 1; }
          unzip -l round12_files.zip
          if unzip -Z1 round12_files.zip | grep -v '/$' | grep -vE '^web/'; then
            echo "The zip contains a path outside web/."; exit 1
          fi
          if unzip -Z1 round12_files.zip | grep -E '(^/|\.\./)'; then
            echo "The zip contains an unsafe path."; exit 1
          fi
          unzip -o round12_files.zip
          rm round12_files.zip
          for f in web/index.html web/sitemap.xml web/about/index.html; do
            [ -f "$f" ] || { echo "MISSING after unpack: $f"; exit 1; }
          done

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply round 12: Google verification tag restored, SEO files"
          git push
