name: Flutter analyze and test

# يشغّل ما لا أستطيع تشغيله في بيئة المحادثة: توليد Drift، flutter analyze،
# وكل ملفات test/. لا ينشر شيئًا ولا يلمس gh-pages.
# شغّله يدويًا من تبويب Actions (Run workflow)، أو يعمل تلقائيًا عند تغيير
# lib/ أو test/ أو pubspec.yaml.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-test.yml'

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Native SQLite (needed by in-memory DB tests on Linux)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs 2>&1 | tee build_runner.log

      - name: Repository boundary check
        run: bash tools/check_repository_boundaries.sh 2>&1 | tee boundaries.log

      - name: Analyze (never stops the tests; gated in the last step)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Run all tests (root test/ only)
        continue-on-error: true
        run: |
          flutter test --reporter expanded 2>&1 | tee test.log

      - name: Build web (release)
        continue-on-error: true
        run: |
          flutter build web --release 2>&1 | tee build_web.log

      - name: Summary
        if: always()
        run: |
          echo "=== analyze: errors ==="
          grep -E "error •" analyze.log | sed 's/^ *//' | sort -u | head -100 || true
          echo
          echo "=== tests: result line ==="
          grep -E "All tests passed|Some tests failed|\+[0-9]+.*(-[0-9]+)?:" test.log | tail -3 || true
          echo
          echo "=== tests: failures ==="
          grep -E "\[E\]|FAILED|Exception|Expected:|Actual:" test.log | head -80 || true

      - name: Job summary (shown on the run's main page)
        if: always()
        run: |
          {
            echo "## Test result"
            echo '```'
            grep -E "All tests passed|Some tests failed" test.log | tail -2 || true
            echo '```'
            echo "## Failures"
            echo '```'
            grep -E "\[E\]|Expected:|Actual:|Exception|Error:" -B2 -A6 test.log | head -150 || true
            echo '```'
            echo "## Analyze errors"
            echo '```'
            grep -E "error •" analyze.log | sort -u | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate (fails the job if analyze has errors or any test failed)
        if: always()
        run: |
          fail=0
          if grep -qE "^ +error •" analyze.log; then echo "analyze: ERRORS FOUND"; fail=1; fi
          if grep -qE "Some tests failed|Failed to load|Error: " test.log; then echo "tests: FAILURES FOUND"; fail=1; fi
          if ! grep -qE "All tests passed" test.log; then echo "tests: 'All tests passed' not seen"; fail=1; fi
          exit $fail

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-and-test-logs
          path: |
            build_runner.log
            boundaries.log
            analyze.log
            test.log
          if-no-files-found: ignore
