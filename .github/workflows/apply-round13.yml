name: Apply round 13 files

# One-time helper: page title only (lib/ui/app.dart). Upload round13_files.zip to the repository ROOT,
# then run manually. It refuses any path outside lib/, deletes the zip, commits, does not deploy.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        shell: bash
        run: |
          set -e
          [ -f round13_files.zip ] || { echo "round13_files.zip is not in the repository root. Upload it first."; exit 1; }
          unzip -l round13_files.zip
          if unzip -Z1 round13_files.zip | grep -v '/$' | grep -vE '^lib/'; then
            echo "The zip contains a path outside lib/."; exit 1
          fi
          if unzip -Z1 round13_files.zip | grep -E '(^/|\.\./)'; then
            echo "The zip contains an unsafe path."; exit 1
          fi
          unzip -o round13_files.zip
          rm round13_files.zip
          for f in lib/ui/app.dart; do
            [ -f "$f" ] || { echo "MISSING after unpack: $f"; exit 1; }
          done

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply round 13: browser title includes the school name"
          git push
