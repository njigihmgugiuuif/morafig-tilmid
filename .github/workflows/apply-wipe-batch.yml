name: Apply wipe batch files

# One-time helper: students clean withdrawn lessons at sync, wipeAll in the server function, tests.
# Upload wipe_batch_files.zip to the repository ROOT, then run
# manually. It refuses any path outside lib/ and test/, deletes the zip, commits,
# does not deploy. After it, run «Flutter analyze and test» by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        shell: bash
        run: |
          set -e
          [ -f wipe_batch_files.zip ] || { echo "wipe_batch_files.zip is not in the repository root. Upload it first."; exit 1; }
          unzip -l wipe_batch_files.zip
          if unzip -Z1 wipe_batch_files.zip | grep -v '/$' | grep -vE '^(lib|test|supabase)/'; then
            echo "The zip contains a path outside lib/, test/ or supabase/."; exit 1
          fi
          if unzip -Z1 wipe_batch_files.zip | grep -E '(^/|\.\./)'; then
            echo "The zip contains an unsafe path."; exit 1
          fi
          unzip -o wipe_batch_files.zip
          rm wipe_batch_files.zip
          for f in lib/services/lesson_remote_service.dart lib/services/lesson_auto_sync.dart test/lesson_remote_sync_test.dart supabase/functions/teacher-publish/index.ts; do
            [ -f "$f" ] || { echo "MISSING after unpack: $f"; exit 1; }
          done

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply wipe batch: sync cleanup, wipeAll action, tests"
          git push
