name: Full build diagnosis

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        continue-on-error: true
        run: |
          flutter pub get 2>&1 | tee -a pub_get.log

      - name: Generate drift code
        continue-on-error: true
        run: dart run build_runner build --delete-conflicting-outputs 2>&1 | tee build_runner.log

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Build web
        continue-on-error: true
        run: flutter build web --release 2>&1 | tee build_web.log

      - name: Summary of all problems
        if: always()
        run: |
          {
            echo "## A. All errors in lib/ (complete, unique)"
            echo '```'
            grep -E "error •" analyze.log | grep -E "• lib/" | sed 's/^ *//' | sort -u | head -200
            echo '```'

            echo "## B. Is drift generating a class named Stream?"
            echo '```'
            grep -n "^class Stream " lib/database/app_database.g.dart || echo "no class Stream generated"
            grep -rn -B3 "class Streams" lib/database/tables || true
            echo '```'

            echo "## C. lib/ui/app.dart (first 60 lines)"
            echo '```'
            sed -n 1,60p lib/ui/app.dart
            echo '```'

            echo "## D. imports of each repository"
            echo '```'
            for f in lib/repositories/*.dart; do echo "--- $f"; head -12 "$f"; done
            echo '```'

            echo "## E. deploy workflow"
            echo '```'
            cat .github/workflows/unzip-and-deploy.yml
            echo '```'

            echo "## F. build_runner result"
            echo '```'
            tail -15 build_runner.log
            echo '```'

            echo "## G. generated files tracked in repo"
            echo '```'
            git ls-files '*.g.dart' | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: "*.log"
