name: Apply phase E batch 5 (teacher separation + shared lessons + batch 4) files

# One-time helper (same pattern as "Apply phase C files"). Upload
# batch5_files.zip to the repository ROOT (one upload), then run this workflow
# manually (Actions -> Apply phase E batch 5 (teacher separation + shared lessons + batch 4) files -> Run workflow). It unpacks
# the zip keeping every file's own folder path (batch 4 files + teacher separation / shared lessons),
# deletes the zip and commits to main. It refuses any path outside lib/, test/ and web/, so
# it never touches .github/ (pubspec.yaml is allowed ONLY here: it adds the http package), and it does
# not deploy. Afterwards run "Flutter analyze and test" manually (a commit made
# with the built-in token does not start other workflows).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        shell: bash
        run: |
          set -e
          [ -f batch5_files.zip ] || { echo "batch5_files.zip is not in the repository root. Upload it first."; exit 1; }
          unzip -l batch5_files.zip
          if unzip -Z1 batch5_files.zip | grep -v '/$' | grep -vE '^(lib/|test/|web/|supabase/|pubspec\.yaml$|SUPABASE_SETUP_AR\.md$)'; then
            echo "The zip contains a path outside lib/, test/, web/, supabase/ or the two allowed root files."; exit 1
          fi
          if unzip -Z1 batch5_files.zip | grep -E '(^/|\.\./)'; then
            echo "The zip contains an unsafe path."; exit 1
          fi
          unzip -o batch5_files.zip
          rm batch5_files.zip
          for f in lib/ui/state/progress_data.dart lib/ui/design/charts.dart lib/ui/widgets/unsaved_changes_scope.dart lib/services/time_learning_service.dart test/ui_widgets_test.dart lib/ui/teacher/teacher_portal_app.dart lib/services/lesson_remote_service.dart supabase/setup.sql; do
            [ -f "$f" ] || { echo "MISSING after unpack: $f"; exit 1; }
          done

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply phase E batch 5 (teacher separation + shared lessons + batch 4): engine charts, actual session recording, unsaved-changes guard, settings/teacher/library restyle"
          git push
