name: Apply phase E batch 3 files

# One-time helper (same pattern as "Apply phase C files"). Upload
# batch3_files.zip to the repository ROOT (one upload), then run this workflow
# manually (Actions -> Apply phase E batch 3 files -> Run workflow). It unpacks
# the zip keeping every file's own folder path (1 file under lib/),
# deletes the zip and commits to main. It refuses any path outside lib/, test/ and web/, so
# it never touches .github/, pubspec.yaml or any dependency, and it does
# not deploy. Afterwards run "Flutter analyze and test" manually (a commit made
# with the built-in token does not start other workflows).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        shell: bash
        run: |
          set -e
          [ -f batch3_files.zip ] || { echo "batch3_files.zip is not in the repository root. Upload it first."; exit 1; }
          unzip -l batch3_files.zip
          if unzip -Z1 batch3_files.zip | grep -v '/$' | grep -vE '^(lib/|test/|web/)'; then
            echo "The zip contains a path outside lib/, test/ or web/."; exit 1
          fi
          if unzip -Z1 batch3_files.zip | grep -E '(^/|\.\./)'; then
            echo "The zip contains an unsafe path."; exit 1
          fi
          unzip -o batch3_files.zip
          rm batch3_files.zip
          for f in lib/ui/screens/dashboard_screen.dart; do
            [ -f "$f" ] || { echo "MISSING after unpack: $f"; exit 1; }
          done

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply phase E batch 3: workload card says when no free time was entered"
          git push
